name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include a minimal Rust example or commands to reproduce.
      render: rust
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Crate version and Rust version
      placeholder: ciber_config 0.1.0; rustc 1.x
    validations:
      required: true
