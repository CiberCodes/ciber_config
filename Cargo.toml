[package]
name = "ciber_config"
version = "0.1.0"
edition = "2024"
authors = ["CiberCodes <tuliosouza0803@gmail.com>"]
description = "A Rust library for loading and managing application configuration"
repository = "https://github.com/CiberCodes/ciber_config"
documentation = "https://docs.rs/ciber_config"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["config", "configuration", "settings"]
categories = ["config", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-value = { version = "0.7", optional = true }
ciber_serde = "0.1"
serde_json = { version = "1", optional = true }
ron = { version = "0.12.3", optional = true }
toml = { version = "1.2.1+spec-1.1.0", optional = true }
serde-saphyr = { version = "2.1.1", optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "custom_format"
required-features = ["custom_fmt"]

[features]
default = []
json = ["dep:serde_json"]
ron = ["dep:ron"]
toml = ["dep:toml"]
yml = ["dep:serde-saphyr"]
custom_fmt = ["dep:serde-value"]
full = ["json", "ron", "toml", "yml", "custom_fmt"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
